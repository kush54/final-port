<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duvera Project</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400;500&display=swap"

    <div id="about" class="about-section">

            <a href="https://p1-1-0ovv.onrender.com/" class="btn">Live-link</a>
          </div>
        </div>

        <!-- Tech Stack -->
        <div class="tech-stack">
          <h2>Tech Stack</h2>
          <div class="skills-container">
            <div class="skill">
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/React-icon.svg/2300px-React-icon.svg.png"

              />
              <span>React</span>
            </div>
            <div class="skill">
              <img
                src="https://cdn.worldvectorlogo.com/logos/redux.svg"
                alt="CSS"
              />

            </div>
            <div class="skill">
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Tailwind_CSS_Logo.svg/2560px-Tailwind_CSS_Logo.svg.png"

            <div class="skill">
              <img
                src="https://cdn.worldvectorlogo.com/logos/expressjs.svg"

              />

            </div>
            <div class="skill">
              <img
                src="https://cdn.worldvectorlogo.com/logos/mongodb-icon-1.svg"

            </div>
            <div class="skill">

            <div class="skill">
              <img
                src="https://i0.wp.com/community.nodemailer.com/wp-content/uploads/2015/10/n2-2.png?fit=422%2C360&ssl=1"
